[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bridgeiq"
version = "0.1.0"
description = "BridgeIQ: AI-Powered Hidden Talent Intelligence Box"
authors = [
    { name = "AISpire Team 04", email = "team04@aispire.hackathon" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "openai>=1.40.0",
    "azure-identity>=1.17.0",
    "azure-search-documents>=11.6.0b1",
    "azure-cosmos>=4.7.0",
    "azure-storage-blob>=12.20.0",
    "httpx>=0.27.0",
    "tenacity>=8.5.0",
    "streamlit>=1.37.0",
    "plotly>=5.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "Docs"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
